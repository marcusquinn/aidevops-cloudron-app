version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
    reviewers:
      - "marcusquinn"
    open-pull-requests-limit: 5
    # aidevops pins move with aidevops_ref via `aidevops sync-workflows`.
    ignore:
      - dependency-name: "marcusquinn/aidevops*"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
    reviewers:
      - "marcusquinn"
    open-pull-requests-limit: 5
